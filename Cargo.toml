[workspace]
members = [
  "crates/music-core",
  "crates/music-server",
  "crates/music-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ilya Timonin"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
fs2 = "0.4"
futures-util = "0.3"
sha2 = "0.10"
sysinfo = "0.37"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
parakeet-rs = { version = "0.3.6", default-features = false, features = ["load-dynamic"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.16", features = ["serde", "v7"] }
